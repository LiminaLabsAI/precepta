/* ---------- helpers ---------- */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function th(t,pad){ return `<th style="text-align:left;padding:${pad||'10px 16px'};color:#6B7280;font-weight:500;font-size:12px;white-space:nowrap">${t}</th>`; }
function toggleHtml(on, handler){
  return `<div onclick="${handler}" style="width:36px;height:20px;border-radius:10px;background:${on?'#3B82F6':'#E5E7EB'};position:relative;cursor:pointer;flex:none"><div style="width:16px;height:16px;border-radius:50%;background:#fff;position:absolute;top:2px;left:${on?'18px':'2px'};box-shadow:0 1px 2px rgba(0,0,0,.2)"></div></div>`;
}
function boundaryPill(b){
  return { bg:b.inBoundary?'#F3F4F6':'#FEF2F2', col:b.inBoundary?'#374151':'#991B1B', label:b.inBoundary?'Intent within boundary':'Intent crosses boundary' };
}
function conditionChips(c){
  const chips=[]; c=c||{};
  if(c.urlAllowlist) chips.push('allowlist: '+c.urlAllowlist.length+' domain'+(c.urlAllowlist.length>1?'s':''));
  if(c.urlBlocklist) chips.push('blocklist: '+c.urlBlocklist.length+' domain'+(c.urlBlocklist.length>1?'s':''));
  if(c.maxTokensPerDay||c.max_tokens_per_day) chips.push(Number(c.maxTokensPerDay||c.max_tokens_per_day).toLocaleString()+' tokens/day');
  if(c.maxCallsPerHour||c.max_calls_per_hour) chips.push((c.maxCallsPerHour||c.max_calls_per_hour)+' calls/hour');
  if(c.maxDailyCostUsd||c.max_daily_cost_usd) chips.push('$'+(c.maxDailyCostUsd||c.max_daily_cost_usd)+'/day cap');
  if(c.piiFilterOutput||c.pii_filter_output) chips.push('PII filter on');
  if(c.requireDataTag||c.require_data_tag) chips.push('requires data tag');
  return chips;
}
function pendingBanner(text){
  return `<div style="display:flex;align-items:flex-start;gap:10px;padding:12px 16px;background:#FFFBEB;border:1px solid #FDE68A;border-radius:8px;margin-bottom:20px">

}

/* ---------- app methods (base; live script overrides the networked ones) ---------- */
const app = {
  set(k,v){ state[k]=v; },
  onSelect(k,v){ state[k]=v; render(); },
  setScreen(s){ state.screen=s; state.profileMenuOpen=false; render(); },
  goToPolicies(){ state.screen='policies'; render(); },
  goToAuditFiltered(f){ state.screen='audit'; state.auditEventFilter=f; render(); },
  skipOnboarding(){ state.screen='overview'; render(); },
  selectInfra(id){ state.infraSelected=id; state.connectionStatus='idle'; render(); },
  testConnection(){ state.connectionStatus='testing'; render(); setTimeout(()=>{ state.connectionStatus='success'; render(); },700); },
  nextStep(){ if(state.onboardStep>=2){ state.screen='overview'; state.showSetupToast=true; render(); return;} state.onboardStep++; render(); },
  prevStep(){ state.onboardStep=Math.max(0,state.onboardStep-1); render(); },
  dismissSetupToast(){ state.showSetupToast=false; render(); },
  toggleControl(key){ state.securityControls[key]=!state.securityControls[key]; render(); },
  runEgressProbe(){ state.egressProbeStatus='running'; render(); setTimeout(()=>{ state.egressProbeStatus='done'; render(); },900); },
  openAddBackend(){ Object.assign(state,{addBackendOpen:true,newBackendName:'',newBackendModel:'',newBackendLocation:'',newBackendInBoundary:true,newBackendType:'onprem',newBackendEndpoint:'',newBackendKey:'',newBackendRegion:'mumbai',newBackendTier:'2'}); render(); },
  closeAddBackend(){ state.addBackendOpen=false; render(); },
  setNewBackendType(t){ state.newBackendType=t; state.newBackendInBoundary=(t!=='hf'); render(); },  // HF defaults external (public API); tick the box for a dedicated in-VPC endpoint
  toggleNewBackendBoundary(){ state.newBackendInBoundary=!state.newBackendInBoundary; render(); },
  toggleBackendBoundary(i){ if(state.backends[i]){ state.backends[i].inBoundary=!state.backends[i].inBoundary; render(); } },
  addBackend(){ state.addBackendOpen=false; render(); },        // overridden live
  toggleApprovedBackend(name){ const a=state.approvedBackends; state.approvedBackends = a.includes(name)?a.filter(n=>n!==name):[...a,name]; render(); },
  toggleSmartRouting(){ const on=(window.__org||{}).optimize_auto==='true'; app.saveOrgSetting('optimize_auto', on?'false':'true'); },
  toggleLearningLoop(){ state.learningLoopEnabled=!state.learningLoopEnabled; render(); },

  openNewPolicy(){ Object.assign(state,{newPolicyOpen:true,editingPolicyId:null,newPolicyName:'',newPolicyDesc:'',newPolicyAction:'chat.completion',newPolicyEffect:'block',newPolicyUrlAllow:'',newPolicyUrlBlock:'',newPolicyMaxTokens:'',newPolicyMaxCalls:'',newPolicyMaxCost:'',newPolicyPii:false,newPolicyDataTag:false,newPolicyScopeKeys:[],newPolicyScopeBackends:[],newPolicyScopeModels:[]}); render(); },
  openEditPolicy(id){ const p=(window.__policies||[]).find(x=>x.id===id); if(!p)return; const c=p.conditions||{}, sc=p.scope||{}; Object.assign(state,{newPolicyOpen:true,editingPolicyId:id,newPolicyName:p.name||'',newPolicyDesc:p.description||'',newPolicyAction:p.action_type||'chat.completion',newPolicyEffect:p.effect||'block',newPolicyUrlAllow:(c.url_allowlist||[]).join(', '),newPolicyUrlBlock:(c.url_blocklist||[]).join(', '),newPolicyMaxTokens:c.max_tokens_per_day||'',newPolicyMaxCalls:c.max_calls_per_hour||'',newPolicyMaxCost:c.max_daily_cost_usd||'',newPolicyPii:!!c.pii_filter_output,newPolicyDataTag:!!c.require_data_tag,newPolicyScopeKeys:(sc.keys||[]).slice(),newPolicyScopeBackends:(sc.backends||[]).slice(),newPolicyScopeModels:(sc.models||[]).slice()}); render(); },
  closeNewPolicy(){ state.newPolicyOpen=false; render(); },
  toggleNewPolicyPii(){ state.newPolicyPii=!state.newPolicyPii; },
  toggleNewPolicyDataTag(){ state.newPolicyDataTag=!state.newPolicyDataTag; },
  toggleScope(dim,value){ const key='newPolicyScope'+dim; const a=state[key]; state[key]=a.includes(value)?a.filter(v=>v!==value):[...a,value]; render(); },
  addPolicy(){ state.newPolicyOpen=false; render(); },          // overridden live
  togglePolicy(id){ render(); },                                // overridden live

  openAttestation(){ state.attestationOpen=true; render(); },
  closeAttestation(){ state.attestationOpen=false; render(); },
  verifyChain(){ render(); },
  setAuditFilter(f){ state.auditEventFilter=f; render(); },

  openSettings(){ state.settingsOpen=true; state.profileMenuOpen=false; render(); if(window.__loadAuthz) window.__loadAuthz(); },

  stop(e){ e.stopPropagation(); },

  // keys
  openNewKey(){ Object.assign(state,{newKeyOpen:true,editingKeyId:null,newKeyName:'',newKeyRole:'user',newKeyExpiry:'90',newKeyDailyCost:'',newKeyMonthlyCost:'',newKeyTokenDaily:'',newKeyTokenMonthly:'',newKeyBackends:[],newKeyModels:[]}); render(); },
  openEditKey(id){ const k=(window.__keys||[]).find(x=>x.id===id); if(!k)return; Object.assign(state,{newKeyOpen:true,editingKeyId:id,newKeyName:k.name,newKeyRole:k.role||'user',newKeyExpiry:'keep',newKeyDailyCost:k.cost_cap_daily||'',newKeyMonthlyCost:k.cost_cap_monthly||'',newKeyTokenDaily:k.token_cap_daily||'',newKeyTokenMonthly:k.token_cap_monthly||'',newKeyBackends:(k.backends_list||[]).slice(),newKeyModels:(k.models_list||[]).slice()}); render(); },
  toggleKeyBackend(n){ const a=state.newKeyBackends; const i=a.indexOf(n); if(i<0)a.push(n); else a.splice(i,1); render(); },
  toggleKeyModel(v){ const a=state.newKeyModels; const i=a.indexOf(v); if(i<0)a.push(v); else a.splice(i,1); render(); },
  closeNewKey(){ state.newKeyOpen=false; render(); },
  addKey(){ state.newKeyOpen=false; render(); },                // overridden live
  closeRevealKey(){ state.revealKeyOpen=false; state.revealKeyCopied=false; render(); },
  copyRevealKey(){ if(navigator.clipboard) navigator.clipboard.writeText(state.revealKeyValue).catch(()=>{}); state.revealKeyCopied=true; render(); },
  openDeleteConfirm(id,name){ state.deleteConfirmKey={id,name}; render(); },
  closeDeleteConfirm(){ state.deleteConfirmKey=null; render(); },
  confirmDeleteKey(){ render(); },                              // overridden live

  // playground
  setChatModel(v){ state.chatModel=v; },
  handleChatKey(e){ if(e.key==='Enter') app.sendMessage(); },
  newChat(){ state.messages=[]; state.chatInput=''; render(); },
  sendMessage(){ render(); },                                   // overridden live
  sendSuggested(){}, sendPreset(){},

  // settings

function notifDest(type){
  const t=(type||'').toLowerCase();
  if(t.indexOf('budget')===0) return {screen:'keys', label:'Keys & budgets'};
  if(t.indexOf('sensitive')>=0) return {screen:'policies', label:'Policies'};
  if(t.indexOf('compression')>=0) return {screen:'savings', label:'Cache & compression'};
  return null;                         // system/other → informational, no destination
}
function notifPanel(){
  const feed=(window.__notifs&&window.__notifs.notifications)||[];
  const dest=notifDest;
  const rows = feed.length ? feed.map(n=>{
    const crit=n.severity==='critical';
    const when=(n.sent_at||'').replace('T',' ').slice(0,16);
    const d=dest(n.type);
    return `<div onclick="app.onNotifClick('${esc(n.type)}')" style="padding:11px 14px;border-bottom:1px solid #F9FAFB;background:${n.read?'#fff':'#F5F8FF'};cursor:pointer">

      </div>
      <div style="font-size:11.5px;color:#6B7280;margin-top:3px;line-height:1.45;padding-left:14px">${esc(n.body)}</div>

  }).join('') : `<div style="padding:28px 14px;text-align:center"><i data-lucide="bell-off" style="width:18px;height:18px;color:#D1D5DB"></i><div style="font-size:12px;color:#9CA3AF;margin-top:8px">No notifications yet.</div></div>`;
  return `<div onclick="event.stopPropagation()" style="position:absolute;top:38px;right:0;background:#fff;border:1px solid #E5E7EB;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,0.12);width:340px;max-height:420px;display:flex;flex-direction:column;z-index:70">

    <div class="pc-scroll" style="overflow-y:auto;flex:1">
      ${rows}
    </div>
  </div>`;
}

/* ---------- Model plane ---------- */
function priceCell(b){
  const pin=Number(b.priceIn||0), pout=Number(b.priceOut||0);
  const open=`app.openPriceEdit('${esc(b.name)}',${JSON.stringify(esc(b.model||'')).replace(/"/g,'&quot;')},${pin},${pout})`;
  if(b.priceMissing) return `<span onclick="${open}" title="Set the per-1M-token price for this backend" style="font-size:11.5px;font-weight:500;color:#B45309;background:#FEF3C7;padding:2px 8px;border-radius:10px;cursor:pointer">Set price</span>`;
  if(pin===0 && pout===0) return `<span title="Local backend — free" style="font-size:12px;font-weight:500;color:#059669">Free</span>`;
  return `<span onclick="${open}" title="Click to edit price" style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#111827;cursor:pointer;border-bottom:1px dashed #D1D5DB">$${pin.toFixed(2)} / $${pout.toFixed(2)}</span>`;
}

  const s=state, p=s.priceEditFor; if(!p) return '';
  return `<div onclick="app.closePriceEdit()" style="position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:70;display:flex;align-items:center;justify-content:center;padding:24px">

      <div style="display:flex;gap:12px;margin-bottom:16px">

      <div style="display:flex;justify-content:flex-end;gap:10px"><button onclick="app.closePriceEdit()" style="padding:7px 14px;border-radius:6px;font-size:13.5px;font-weight:500;background:#fff;color:#111827;border:1px solid #E5E7EB;cursor:pointer">Cancel</button><button onclick="app.savePrice()" style="padding:7px 14px;border-radius:6px;font-size:13.5px;font-weight:500;background:#3B82F6;color:#fff;border:none;cursor:pointer">Save price</button></div>

  const tBadge=t=>{const bg={'pre-call':'#EFF6FF','during-call':'#FFFBEB','post-call':'#F0FDF4'}[t]||'#F3F4F6';const fg={'pre-call':'#1D4ED8','during-call':'#92400E','post-call':'#065F46'}[t]||'#6B7280';return `<span style="font-size:9.5px;font-weight:600;padding:1px 8px;border-radius:8px;background:${bg};color:${fg}">${esc(t||'')}</span>`;};
  const stages=w.stages||[];
  const rail=stages.map((s,i)=>{const routing=s.name==='routing';return `
    <div style="display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid ${routing?'#BFDBFE':'#E5E7EB'};border-radius:8px;background:${routing?'#F8FAFF':'#fff'}">
      <span style="width:96px;flex:none;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:${routing?'#1D4ED8':'#9CA3AF'}">${routing?'routing layer':'fixed rail'}</span>
      <span style="flex:1;font-size:13px;font-weight:600;color:#111827">${esc(s.label)}</span>

/* ---------- Traces ---------- */
function traceColors(st){
  if(st==='blocked'||st==='failed') return {bg:'#FEF2F2',fg:'#991B1B',bar:'#DC2626'};
  if(st==='warn') return {bg:'#FFFBEB',fg:'#92400E',bar:'#D97706'};
  if(st==='hit') return {bg:'#EFF6FF',fg:'#1D4ED8',bar:'#2563EB'};
  if(st==='skipped') return {bg:'#F3F4F6',fg:'#6B7280',bar:'#9CA3AF'};
  return {bg:'#F0FDF4',fg:'#065F46',bar:'#059669'};
}
function traceLabel(name){return {firewall:'PII & injection',sensitivity:'Sensitivity',policy:'Policy check',cache:'Cache',compression:'Compression',routing:'Smart routing',inference:'Inference',output:'Output scan'}[name]||name;}

  // ── middle: checkpoint waterfall (click a step to expand its details) ──

  if(!ready){ checkPane=`<div style="padding:20px;font-size:12px;color:#9CA3AF">Loading trace…</div>`; }

        ${kv('Status',s.status)}${kv('Duration',s.ms+'ms')}${kv('Stage',s.name)}${s.inferred?kv('Router intent','inferred (a guess from the request, not a stated fact)'):''}
      </div>`:'';
      const dot=`<span style="width:7px;height:7px;flex:none;border-radius:50%;background:${c.bar};display:inline-block"></span>`;

            <span style="width:46px;flex:none;text-align:right;font-size:10.5px;color:#6B7280;font-family:'JetBrains Mono',monospace">${s.ms}ms</span>

          <div style="margin-left:126px;margin-top:4px;font-size:12px;line-height:1.4"><span style="font-weight:600;color:${c.fg}">${esc(s.decision)}</span>${s.inferred?' <span style="font-size:9px;font-weight:700;color:#92400E;background:#FFFBEB;padding:1px 6px;border-radius:8px">inferred</span>':''}</div>
        </div>${det}
      </div>`;}).join('');
    checkPane=`<div style="padding:10px 14px;border-bottom:1px solid #E5E7EB;font-size:10px;color:#6B7280;text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;gap:8px"><span style="flex:none">Checkpoints</span><span style="font-family:'JetBrains Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${detail.request_id.slice(0,8)} · ${detail.total_ms}ms</span></div>${rows||'<div style="padding:16px;font-size:12px;color:#9CA3AF">No steps.</div>'}`;
  }

  // ── right: detail tabs (summary / route / messages / attributes) ──

  const rw=state.trRunsW||240, cw=state.trCheckW||360, dw=340;

function traceSummarySentence(d){
  const s=d.steps||[]; const blk=s.find(x=>x.status==='blocked'||x.status==='failed');
  if(blk) return 'Blocked at the '+blk.name+' step: '+blk.reason;
  const parts=[]; const fw=s.find(x=>x.name==='firewall'); if(fw&&/Redacted/.test(fw.decision)) parts.push(fw.decision.toLowerCase());
  const rt=s.find(x=>x.name==='routing'); if(rt) parts.push(rt.decision.toLowerCase()+(rt.inferred?' (intent inferred)':''));
  const cache=s.find(x=>x.status==='hit'); if(cache) parts.push('served from cache');
  return (parts.length?parts.join(', ')+'; ':'')+'completed in '+d.total_ms+'ms — '+d.outcome+'.';
}

  const rowline=(title,desc,right)=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 0;border-bottom:1px solid #F3F4F6"><div><div style="font-size:13px;font-weight:500">${title}</div><div style="font-size:11px;color:#9CA3AF;margin-top:2px;max-width:460px;line-height:1.5">${desc}</div></div>${right}</div>`;

  const sel=(val,opts,handler)=>`<select onchange="${handler}" style="padding:6px 10px;border:1px solid #E5E7EB;border-radius:6px;font-size:12.5px;background:#fff">${opts.map(o=>`<option value="${o[0]}" ${o[0]===val?'selected':''}>${o[1]}</option>`).join('')}</select>`;
  const listCard=(header,sub,rowsHtml,byo)=>`<div style="border:1px solid #E5E7EB;border-radius:8px;overflow:hidden"><div style="padding:14px 20px;border-bottom:1px solid #E5E7EB"><div style="font-weight:600;font-size:14px">${header}</div><div style="font-size:11px;color:#9CA3AF;margin-top:2px">${sub}</div></div>${rowsHtml||`<div style="padding:14px 20px;font-size:12px;color:#9CA3AF">No inference endpoints registered yet.</div>`}<div style="padding:12px 20px;border-top:1px dashed #E5E7EB;font-size:12px;color:#9CA3AF">${byo}</div></div>`;
  const card=(inner)=>`<div style="border:1px solid #E5E7EB;border-radius:8px;padding:20px;margin-bottom:16px">${inner}</div>`;
  let body;
  if(tab==='cache'){
    const cs=auto.cache_stats||{};
    const exactOn=!!auto.cache_enabled, semOn=auto.cache_enabled&&auto.cache_strategy==='semantic';
    const statsRow=(cs.entries||cs.hits)?`<div style="margin-top:14px;padding-top:14px;border-top:1px solid #F3F4F6;display:flex;gap:24px">${statBig(cs.hits||0,'Cache hits')}${statBig(cs.tokens_saved||0,'Tokens saved')}${statBig('$'+(cs.cost_saved_usd||0).toFixed(4),'Saved')}</div>`:`<div style="margin-top:12px;font-size:11.5px;color:#9CA3AF">No cache activity yet.</div>`;
    const defaults=card(
      `<div style="font-weight:600;font-size:14px;margin-bottom:2px">Response cache — Smart router default</div>
       <div style="font-size:11px;color:#9CA3AF;margin-bottom:8px">Applies to router-decided (auto) requests. Per-endpoint overrides are below.</div>`+
      rowline('Exact-match cache','Reuses a previous answer only when the request is identical. On by default.', sw(exactOn,`app.setFeature('auto',{cache_enabled:${exactOn?'false':'true'},cache_strategy:'exact'})`))+
      rowline('Semantic cache','Reuses a similar (not identical) answer. Off by default — it can confidently serve a wrong match.', sw(semOn,`app.setFeature('auto',{cache_enabled:true,cache_strategy:'${semOn?'exact':'semantic'}'})`))+
      statsRow+
      `<div style="font-size:10.5px;color:#9CA3AF;margin-top:8px">Visible only to admins — the user just gets an answer.</div>
       <a href="#" onclick="event.preventDefault();app.goToAuditFiltered('cache.hit')" style="font-size:12px;display:inline-block;margin-top:8px;color:#2563EB">View cache.hit events in Audit log →</a>`);
    const rows=models.map(e=>{
      const val=!e.cache_enabled?'off':(e.cache_strategy||'exact');
      return `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 20px;border-bottom:1px solid #F3F4F6"><div><div style="font-size:13px;font-weight:500">${esc(e.label)}</div><div style="font-size:11px;color:#9CA3AF;margin-top:1px;font-family:'JetBrains Mono',monospace">${esc(e.endpoint)}</div></div>${sel(val,[['exact','Exact match'],['semantic','Semantic'],['off','Off']],`app.setCacheStrategy('${esc(e.endpoint)}',this.value)`)}</div>`;
    }).join('');
    body=defaults+listCard('Cache strategy by inference endpoint','Overrides the Smart router default per endpoint.',rows,'+ Bring your own cache algorithm — coming soon')+
      `<div style="margin-top:14px"><button onclick="app.clearCache()" style="padding:6px 12px;border-radius:6px;font-size:12px;font-weight:500;background:#fff;color:#111827;border:1px solid #E5E7EB;cursor:pointer">Clear all cache</button></div>
       <div style="font-size:11px;color:#9CA3AF;margin-top:12px;max-width:640px;line-height:1.55">Only <strong>deterministic</strong> (temperature 0) requests are cached; <strong>sensitive</strong> ones never are. Cost reads $0 on free local endpoints — real dollars accrue against a priced one.</div>`;
  } else {
    const ms=auto.compression_stats||{};
    const aggrOn=auto.compression_enabled&&auto.compression_mode==='aggressive';
    const statsRow=(ms.requests_compressed)?`<div style="margin-top:14px;padding-top:14px;border-top:1px solid #F3F4F6;display:flex;gap:24px">${statBig(ms.requests_compressed||0,'Requests compressed')}${statBig(ms.tokens_saved||0,'Tokens saved')}</div>`:`<div style="margin-top:12px;font-size:11.5px;color:#9CA3AF">No compression activity yet.</div>`;
    const defaults=card(
      `<div style="font-weight:600;font-size:14px;margin-bottom:2px">Prompt compression — Smart router default</div>
       <div style="font-size:11px;color:#9CA3AF;margin-bottom:8px">Applies to router-decided (auto) requests. Per-endpoint overrides are below.</div>`+
      rowline('Baseline trimming','Cuts filler without changing meaning — cannot make an answer worse. Always on.', `<span style="font-size:12px;font-weight:500;padding:2px 8px;border-radius:12px;background:#ECFDF5;color:#065F46;flex:none">Always on</span>`)+
      rowline('Cost-saving mode','Shortens more aggressively (lossy). Opt-in — the caller is notified whenever it is applied.', sw(aggrOn,`app.setFeature('auto',{compression_enabled:true,compression_mode:'${aggrOn?'baseline':'aggressive'}'})`))+
      statsRow+
      `<a href="#" onclick="event.preventDefault();app.goToAuditFiltered('compression')" style="font-size:12px;display:inline-block;margin-top:12px;color:#2563EB">View compression events in Audit log →</a>`);
    const rows=models.map(e=>{
      const val=!e.compression_enabled?'off':(e.compression_mode||'baseline');
      return `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 20px;border-bottom:1px solid #F3F4F6"><div><div style="font-size:13px;font-weight:500">${esc(e.label)}</div><div style="font-size:11px;color:#9CA3AF;margin-top:1px;font-family:'JetBrains Mono',monospace">${esc(e.endpoint)}</div></div>${sel(val,[['baseline','Baseline (safe)'],['aggressive','Aggressive'],['off','Off']],`app.setCompressionMode('${esc(e.endpoint)}',this.value)`)}</div>`;
    }).join('');
    body=defaults+listCard('Compression strategy by inference endpoint','Overrides the Smart router default per endpoint.',rows,'+ Bring your own compression algorithm — coming soon')+
      `<div style="font-size:11px;color:#9CA3AF;margin-top:12px;max-width:640px;line-height:1.55"><strong>Baseline</strong> is quality-safe (whitespace only). <strong>Aggressive</strong> also trims filler (lossy) — the caller sees it and an admin is alerted, never a silent change. Real semantic compression (LLMLingua) + bring-your-own are on the roadmap (FEAT-011 v2).</div>`;
  }
  return h1+tabs+body;
}

        <div style="display:flex;align-items:center;gap:8px"><i data-lucide="${c.icon}" style="width:15px;height:15px;color:${on?'#3B82F6':'#9CA3AF'}"></i><span style="font-weight:600;font-size:13px">${c.label}</span></div>
        ${right}
      </div>
      <div style="font-size:12px;color:#6B7280;line-height:1.5">${sub}</div>
      ${c.hasProbe?`<div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid #F3F4F6"><span style="font-size:11px;color:#9CA3AF">${probeText}</span><button onclick="app.runEgressProbe()" style="padding:4px 10px;border-radius:6px;font-size:12px;font-weight:500;background:#fff;color:#111827;border:1px solid #E5E7EB;cursor:pointer">${probeBtn}</button></div>`:''}
    </div>`;}).join('');

  const effectStyles={block:{bg:'#FEF2F2',color:'#991B1B'},warn:{bg:'#FFFBEB',color:'#92400E'},audit:{bg:'#EFF6FF',color:'#1D4ED8'}};

      <div style="display:flex;align-items:center;justify-content:space-between">

        ${toggleHtml((window.__org||{}).optimize_auto==='true','app.toggleSmartRouting()')}

    <div style="font-size:12px;color:#6B7280;margin-bottom:16px">Evaluated on every request, most-restrictive wins: block &gt; warn &gt; audit-only.</div>

/* ---------- Audit & Attestation ---------- */
function eventGroup(ev){
  ev=String(ev||'');
  if(ev.indexOf('cache')>=0||ev.indexOf('compression')>=0) return 'cache';
  if(ev.indexOf('policy')>=0) return 'policy';
  if(ev.indexOf('attestation')>=0) return 'attestation';
  if(ev.indexOf('chat')>=0) return 'chat';
  return 'other';
}
function auditView(){
  const s=state;
  const outcomeStyles={blocked:{bg:'#FEF2F2',color:'#991B1B'},warned:{bg:'#FFFBEB',color:'#92400E'},allowed:{bg:'#F3F4F6',color:'#374151'}};
  const loaded = Array.isArray(window.__auditlog);
  const all = loaded ? window.__auditlog : [];
  const filtered = s.auditEventFilter==='all' ? all : all.filter(r=>eventGroup(r.event)===s.auditEventFilter);
  const filterDefs=[{v:'all',l:'All events'},{v:'chat',l:'Chat'},{v:'cache',l:'Cache & compression'},{v:'policy',l:'Policy'},{v:'attestation',l:'Attestation'}];
  const chips=filterDefs.map(f=>{const on=s.auditEventFilter===f.v;return `<div onclick="app.setAuditFilter('${f.v}')" style="padding:5px 11px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid ${on?'#111827':'#E5E7EB'};background:${on?'#111827':'#fff'};color:${on?'#fff':'#374151'}">${f.l}</div>`;}).join('');
  const rows = filtered.map(r=>{
    const o=outcomeStyles[r.outcome]||{bg:'#F3F4F6',color:'#374151'};const oc=String(r.outcome||'—');
    const exp = s.expandedAuditHash===r.hash;
    const main=`<tr onclick="app.toggleAuditRow('${esc(r.hash)}')" style="border-top:1px solid #E5E7EB;cursor:pointer">
      <td style="padding:10px 16px;font-size:12px"><div style="display:flex;align-items:center;gap:6px"><i data-lucide="${exp?'chevron-down':'chevron-right'}" style="width:12px;height:12px;color:#9CA3AF"></i>${esc(r.time)}</div></td>
      <td style="padding:10px 16px;font-size:12px">${esc(r.actor)}</td>
      <td style="padding:10px 16px;font-size:12px">${esc(r.event)}</td>
      <td style="padding:10px 16px;font-size:12px">${esc(r.backend)}</td>
      <td style="padding:10px 16px"><span style="font-size:12px;font-weight:500;padding:2px 8px;border-radius:12px;background:${o.bg};color:${o.color}">${oc.charAt(0).toUpperCase()+oc.slice(1)}</span></td>
      <td style="padding:10px 16px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#9CA3AF">${esc(r.hash)}</td>
    </tr>`;
    const detail = exp?`<tr style="border-top:1px solid #E5E7EB;background:#F9FAFB"><td colspan="6" style="padding:14px 16px 16px 42px">
      ${[['Actor',r.actor],['Event',r.event],['Backend',r.backend],['Outcome',oc],['Entry hash',r.hash]].map(d=>`<div style="display:flex;gap:10px;margin-bottom:6px;font-size:12.5px"><span style="color:#6B7280;min-width:120px;flex:none">${d[0]}</span><span style="color:#111827;font-family:${d[0]==='Entry hash'?"'JetBrains Mono',monospace":'inherit'}">${esc(d[1])}</span></div>`).join('')}
      <div style="font-size:11px;color:#9CA3AF;margin-top:6px">This entry's hash chains to the previous one — editing any past row breaks verification.</div>
    </td></tr>`:'';
    return main+detail;
  }).join('');
  const empty = !filtered.length;
  return `<h1 style="font-size:22px;font-weight:700;margin:0 0 6px;letter-spacing:-0.01em">Audit &amp; Attestation</h1>
    <div style="font-size:13px;color:#6B7280;margin-bottom:20px;max-width:680px;line-height:1.6">Every request — allowed, warned or blocked — is written here in a tamper-evident, hash-chained log nothing can quietly edit. Use the attestation below whenever an auditor needs proof — not just a claim — that nothing left your network.</div>

    <div style="border:1px solid #E5E7EB;border-radius:8px;padding:16px;margin-bottom:24px;display:flex;justify-content:space-between;align-items:center;gap:24px">
      <div><div style="font-weight:600;font-size:14px">Learn from usage</div><div style="font-size:12px;color:#6B7280;margin-top:4px;max-width:560px;line-height:1.5">Uses thumbs-up/down from the Playground plus routing outcomes to prefer, per difficulty, the backend that earns the best reward — inside your boundary, never pooled. Needs a few rated requests before it acts; always bounded by governance. Off by default.</div></div>
      ${toggleHtml((window.__org||{}).learning_enabled==='true','app.saveOrgSetting(\'learning_enabled\',\''+(((window.__org||{}).learning_enabled==='true')?'false':'true')+'\')')}
    </div>

    <div style="background:#EFF6FF;border:1px solid #BFDBFE;border-radius:12px;padding:28px;margin-bottom:32px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:32px">
        <div><div style="font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#1D4ED8;font-weight:600;margin-bottom:8px">Sovereignty Attestation</div><div style="font-weight:700;font-size:20px;margin-bottom:10px;color:#111827">Proof your team can hand to an auditor</div><div style="font-size:13px;line-height:1.6;max-width:460px;color:#374151">Active backend set, security-control status, egress-test result and audit-chain verification — signed and hash-anchored.</div></div>
        <button onclick="app.openAttestation()" style="padding:9px 16px;border-radius:6px;font-size:13.5px;font-weight:600;background:#3B82F6;color:#fff;border:none;cursor:pointer;flex:none">Generate attestation</button>
      </div>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px">
      <div style="font-weight:600;font-size:14px">Tamper-evident audit log</div>
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-size:12px;font-weight:500;padding:2px 8px;border-radius:12px;background:#ECFDF5;color:#065F46;display:inline-flex;align-items:center;gap:4px"><i data-lucide="check" style="width:11px;height:11px"></i>Chain verified</span>
        <button onclick="app.exportAudit()" style="padding:7px 14px;border-radius:6px;font-size:13.5px;font-weight:500;background:#fff;color:#111827;border:1px solid #E5E7EB;cursor:pointer">Export chain</button>
        <button onclick="app.verifyChain()" style="padding:7px 14px;border-radius:6px;font-size:13.5px;font-weight:500;background:#fff;color:#111827;border:1px solid #E5E7EB;cursor:pointer">Re-verify chain</button>
      </div>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">${chips}</div>
    <div style="border:1px solid #E5E7EB;border-radius:8px;overflow:hidden"><table style="width:100%;border-collapse:collapse;font-size:13px">
      <thead><tr style="background:#F9FAFB">${['Time','Actor','Event','Backend','Outcome','Hash'].map(t=>th(t)).join('')}</tr></thead>
      <tbody>${empty ? `<tr><td colspan="6" style="padding:20px 16px;color:#9CA3AF;font-size:13px">${loaded?'No audit events'+(s.auditEventFilter!=='all'?' for this filter':' yet — run a request in the Playground')+'.':'Loading…'}</td></tr>` : rows}</tbody></table></div>
    ${s.attestationOpen?attestationModal():''}`;
}

function attestationModal(){
  const a = window.__att;
  const cfg = a ? `${(a.config&&a.config.backends?a.config.backends.length:0)} backend(s) in-boundary · Sovereign Mode ${a.sovereign_mode?'ON':'OFF'}` : 'Loading…';
  const aud = a ? `${a.audit.events} events · ${a.audit.external_calls} external calls` : 'Loading…';
  const egr = a ? (a.egress_test&&a.egress_test.result==='blocked'?'Blocked (verified)':(a.egress_test?a.egress_test.result:'—')) : 'Loading…';
  const chn = a ? (a.audit.chain_verified?'Verified ✓':'CHAIN FAILED') : 'Loading…';
  const sig = a ? `sig: ${String(a.signature||'').slice(0,6)}…${String(a.signature||'').slice(-4)} · anchored to ${String(a.anchored_to||'').slice(0,12)}…` : '';
  return `<div onclick="app.closeAttestation()" style="position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px">
    <div onclick="event.stopPropagation()" style="background:#fff;border-radius:12px;padding:28px;max-width:480px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.3)">
      <div style="font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#1D4ED8;font-weight:600;margin-bottom:8px">Sovereignty Attestation${a?'<span style="font-size:10px;font-weight:600;color:#065F46;background:#ECFDF5;padding:1px 7px;border-radius:8px;margin-left:8px">LIVE</span>':''}</div>
      <div style="font-size:18px;font-weight:700;margin-bottom:16px">Proof of a closed, in-boundary loop</div>
      <div style="display:flex;flex-direction:column;gap:12px;font-size:13px">
        <div style="display:flex;justify-content:space-between"><span style="color:#6B7280">Config proof</span><strong>${esc(cfg)}</strong></div>
        <div style="display:flex;justify-content:space-between"><span style="color:#6B7280">Audit proof</span><strong>${esc(aud)}</strong></div>
        <div style="display:flex;justify-content:space-between"><span style="color:#6B7280">Egress test</span><strong>${esc(egr)}</strong></div>
        <div style="display:flex;justify-content:space-between"><span style="color:#6B7280">Chain integrity</span><strong style="color:#059669">${esc(chn)}</strong></div>
      </div>
      ${sig?`<div style="margin-top:16px;padding-top:14px;border-top:1px solid #E5E7EB;font-family:'JetBrains Mono',monospace;font-size:11px;color:#9CA3AF;word-break:break-all">${esc(sig)}</div>`:''}
      <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:20px"><button onclick="app.closeAttestation()" style="padding:7px 14px;border-radius:6px;font-size:13.5px;font-weight:500;background:#fff;color:#111827;border:1px solid #E5E7EB;cursor:pointer">Close</button></div>
    </div></div>`;
}

  const tabs=tabDefs.map(t=>{const a=s.settingsTab===t.key;return `<div onclick="app.setSettingsTab('${t.key}')" style="padding:8px 12px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;background:${a?'#EFF6FF':'transparent'};color:${a?'#1D4ED8':'#6B7280'};margin-bottom:2px">${t.label}</div>`;}).join('');

  const editRow=(label,key,val,ph,type,mono)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #F3F4F6"><div style="font-size:13px;font-weight:500">${label}</div><input ${type?('type="'+type+'"'):''} value="${esc(val==null?'':val)}" onchange="app.saveOrgSetting('${key}',this.value)" placeholder="${esc(ph||'')}" style="width:240px;padding:6px 10px;border:1px solid #E5E7EB;border-radius:6px;font-size:13px;text-align:right;${mono?"font-family:'JetBrains Mono',monospace;":''}"></div>`;
  let pane='';
  if(s.settingsTab==='general'){
    pane=rowKV('Theme','Light','Single-theme by design — matches your brand')

  } else if(s.settingsTab==='security'){
    pane=`<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #F3F4F6"><div><div style="font-size:13px;font-weight:500">Manage security controls</div><div style="font-size:11px;color:#9CA3AF">In-boundary routing, egress lock, audit-on, residency</div></div><a href="#" onclick="event.preventDefault();app.goToPoliciesFromSettings()" style="font-size:12px">Open Policies →</a></div>`
      +rowKV('MCP server endpoint', esc(location.origin)+'/mcp', 'Agentic tools (Cursor, Claude Desktop, agents) reach governed inference here')

  } else if(s.settingsTab==='data'){

  } else if(s.settingsTab==='alerts'){

      const keyStatus = r.hf_key_set

      pane=`<div style="font-size:12px;color:#6B7280;margin-bottom:14px;line-height:1.55">The router uses a small model to read each request's goal (cost / speed / quality). That model runs <strong>inside your network</strong> — the router never sends prompts to Precepta. Choose where it runs. <span style="color:#9CA3AF">Platform-owner only.</span></div>

        <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #F3F4F6">

    }
  } else {
    // members — only the real signed-in account is known to the backend today
    const name=esc(me.name||me.subject||'—'), email=esc(me.subject||''), role=esc(me.role||'user');
    const roles=window.__authzRoles, agents=window.__agentBudgets;
    const roleRows = roles ? Object.keys(roles).map(rn=>`<div style="display:flex;justify-content:space-between;align-items:flex-start;padding:8px 0;border-bottom:1px solid #F3F4F6"><div style="font-size:12.5px;font-weight:500;text-transform:capitalize">${esc(rn)}</div><div style="font-size:11px;color:#6B7280;max-width:360px;text-align:right">${(roles[rn]||[]).map(p=>esc(typeof p==='string'?p:(p.action+(p.when?' ·'+Object.entries(p.when).map(e=>e[0]+'='+e[1]).join(','):''))) ).join(', ')||'—'}</div></div>`).join('') : '<div style="font-size:12px;color:#9CA3AF;padding:8px 0">Loading roles…</div>';
    const agentRows = !agents ? '<div style="font-size:12px;color:#9CA3AF;padding:8px 0">Loading…</div>' : (agents.length ? agents.map(a=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #F3F4F6"><div><div style="font-size:12.5px;font-weight:500">${esc(a.agent_id)}</div>${a.note?`<div style="font-size:11px;color:#9CA3AF">${esc(a.note)}</div>`:''}</div><span style="font-size:11px;font-weight:500;padding:2px 8px;border-radius:12px;background:${a.used_today>=a.daily_request_cap?'#FEF2F2':'#F3F4F6'};color:${a.used_today>=a.daily_request_cap?'#991B1B':'#374151'}">${a.used_today}/${a.daily_request_cap} today</span></div>`).join('') : '<div style="font-size:12px;color:#9CA3AF;padding:8px 0">No agent budgets set. Cap an autonomous caller\'s daily requests below.</div>');
    pane=`<div style="font-size:12px;color:#6B7280;margin-bottom:12px;line-height:1.5">Login (SSO) proves who someone is; <strong>role</strong> decides what they can do (OpenGuard RBAC). Agents that call the API can be capped independently.</div>`
      +`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #F3F4F6"><div><div style="font-size:13px;font-weight:500">${name} <span style="font-size:11px;color:#9CA3AF">(you)</span></div><div style="font-size:11px;color:#9CA3AF">${email}</div></div><span style="font-size:12px;color:#6B7280;padding:4px 10px;border:1px solid #E5E7EB;border-radius:6px">${{admin:'Admin',user:'User',auditor:'Auditor'}[role]||role}</span></div>`
      +`<div style="font-size:12px;font-weight:600;color:#374151;margin:16px 0 2px">Roles &amp; permissions</div>${roleRows}`
      +`<div style="font-size:12px;font-weight:600;color:#374151;margin:16px 0 2px">Agent budgets <span style="font-size:10px;font-weight:600;padding:1px 7px;border-radius:10px;background:#EFF6FF;color:#1D4ED8">FEAT-004</span></div>${agentRows}`
      +`<div style="display:flex;gap:6px;margin-top:12px"><input id="agIdIn" placeholder="agent_id" style="flex:1;padding:6px 10px;border:1px solid #E5E7EB;border-radius:6px;font-size:13px"><input id="agCapIn" type="number" min="1" placeholder="daily cap" style="width:100px;padding:6px 10px;border:1px solid #E5E7EB;border-radius:6px;font-size:13px"><button onclick="app.addAgentBudget()" style="padding:6px 12px;border-radius:6px;font-size:12px;font-weight:500;background:#2563EB;color:#fff;border:none;cursor:pointer">Set cap</button></div>`;
  }
  return `<div onclick="app.closeSettings()" style="position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:24px">
    <div onclick="event.stopPropagation()" style="background:#fff;border-radius:12px;width:100%;max-width:640px;height:540px;box-shadow:0 20px 60px rgba(0,0,0,0.3);display:flex;flex-direction:column;overflow:hidden">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #E5E7EB"><div style="font-size:15px;font-weight:600">Settings</div><button onclick="app.closeSettings()" style="background:transparent;border:none;color:#6B7280;cursor:pointer;padding:4px"><i data-lucide="x" style="width:18px;height:18px"></i></button></div>
      <div style="flex:1;display:flex;overflow:hidden">
        <div style="width:160px;flex:none;border-right:1px solid #E5E7EB;padding:12px 8px">${tabs}</div>
        <div class="pc-scroll" style="flex:1;overflow-y:auto;padding:20px 24px">${pane}</div>

}

/* ---------- root render ---------- */
function contentFor(){
  switch(state.screen){
    case 'onboarding': return onboardingView();
    case 'overview': return overviewView();
    case 'workflow': return workflowView();
    case 'traces': return tracesView();
    case 'modelplane': return modelPlaneView();
    case 'keys': return keysView();
    case 'savings': return savingsView();
    case 'policies': return policiesView();
    case 'audit': return auditView();
    case 'playground': return playgroundView();
    default: return overviewView();
  }
}
function render(){
  const root=document.getElementById('root');
  if(!state.isLoggedIn){ root.innerHTML=loginScreen(); if(window.lucide) lucide.createIcons(); return; }
  root.innerHTML=`<div style="height:100vh;display:flex;flex-direction:column;background:#fff;overflow:hidden" onclick="if(state.profileMenuOpen||state.notifOpen){state.profileMenuOpen=false;state.notifOpen=false;render();}">
    ${topbar()}
    <div style="flex:1;display:flex;overflow:hidden">
      ${sidebar()}
      <div class="pc-scroll" style="flex:1;overflow-y:auto;padding:28px 32px 80px;background:#fff">${contentFor()}</div>
    </div>
    ${state.settingsOpen?settingsModal():''}
    ${copilotFab()}
  </div>`;
  if(window.lucide) lucide.createIcons();
  // Playground: each render replaces the DOM (resetting scroll to top), so
  // pin the chat to the bottom — the newest message stays in view.
  if(state.screen==='playground'){ const pg=document.getElementById('pgScroll'); if(pg) pg.scrollTop=pg.scrollHeight; }
}
render();
</script>

<!-- ── Live mode — when served from the FastAPI backend, fetch real data and
     drive every surface against the API. Opened as file:// it stays in an
     honest empty state (no fabricated numbers). ── -->
<script>
(function(){
  if(!location.protocol.startsWith("http")) return;
  window.__live = true;
  let sessionToken = null;
  try {
    const m = location.hash.match(/[#&]s=([^&]+)/);
    if(m){ sessionToken = decodeURIComponent(m[1]); localStorage.setItem("precepta_session", sessionToken);
           history.replaceState(null, "", location.pathname); }
    else { sessionToken = localStorage.getItem("precepta_session"); }
  } catch(e){}
  const TOKEN = sessionToken || "dev-admin";
  const hdr = {"Content-Type":"application/json","Authorization":"Bearer "+TOKEN};
  if(sessionToken){ state.isLoggedIn = true; render(); }

  // Only return a body for OK responses — a 401/403 must never leak an error
  // object into state (that's how "undefined" tiles happen). Non-OK → null.
  const getJSON = (p)=>fetch(p,{headers:hdr}).then(r=>r.ok?r.json():null).catch(()=>null);

  app.signOut = function(){
    if(sessionToken){ fetch("/auth/logout",{method:"POST",headers:hdr}).catch(()=>{}); }
    try{ localStorage.removeItem("precepta_session"); }catch(e){}
    state.isLoggedIn=false; state.profileMenuOpen=false; state.settingsOpen=false;
    window.__me=null; render();
  };

  async function loadInfra(){
    const d = await getJSON("/infra");
    if(d && d.backends){
      state.backends = d.backends.map(b=>({
        name:b.backend, model:b.model, location:b.in_boundary?"Intent within boundary":"Intent crosses boundary",
        inBoundary:b.in_boundary,
        gpu:(b.vram && b.vram!=="—")?b.vram:"—",
        latency:(b.latency_ms!=null)?b.latency_ms+"ms":"—",
        status:b.status==="healthy"?"healthy":"down",
        priceIn:b.price_input_per_1m, priceOut:b.price_output_per_1m,
        priceMissing:b.price_missing, priceSource:b.price_source,
      }));
      modelOptions.length = 0;
      d.backends.forEach(b=>modelOptions.push({value:b.backend+"/"+b.model, label:b.backend+" / "+b.model}));
      if(d.backends.length){ modelOptions.push({value:"auto:cheapest", label:"auto : cheapest"}); modelOptions.push({value:"auto:best-quality", label:"auto : best-quality"}); }
      if(!state.chatModel && d.backends[0]) state.chatModel = d.backends[0].backend+"/"+d.backends[0].model;
      render();
    }
  }
  async function loadPolicies(){
    const d = await getJSON("/v1/policies");
    if(d && Array.isArray(d.policies)){
      state.policies = d.policies.map(p=>({
        id:p.id, name:p.name, desc:p.description||"", actionType:p.action_type,
        effect:p.effect, conditions:p.conditions||{}, scope:p.scope||{},
        version:p.version, enabled:!!p.enabled,
      }));
      window.__policies = d.policies;
      render();
    }
  }
  async function loadStats(){ const d=await getJSON("/stats"); if(d){ window.__stats=d; render(); } }
  async function loadAuditLog(){ const d=await getJSON("/audit/log?limit=50"); if(d && Array.isArray(d.log)){ window.__auditlog=d.log; render(); } }
  async function loadKeys(){ const d=await getJSON("/v1/keys"); if(d && Array.isArray(d.keys)){ window.__keys=d.keys; render(); } }
  async function loadUsage(){ const d=await getJSON("/v1/usage"); if(d && Array.isArray(d.usage)){ const m={}; d.usage.forEach(r=>m[r.key]=r); window.__usage=m; render(); } }
  async function loadNotifs(){ const d=await getJSON("/notifications"); if(d){ window.__notifs=d; render(); } }
  async function loadApproved(){ const d=await getJSON("/v1/routing/approved"); if(d && Array.isArray(d.approved)){ window.__approved=d.approved; render(); } }
  app.approveBackend = function(name){ state.approvingBackend=name; state.approvingLocation=''; render(); };
  app.cancelApprove = function(){ state.approvingBackend=null; render(); };
  app.confirmApprove = function(){ const name=state.approvingBackend; fetch("/v1/routing/approved",{method:"POST",headers:hdr,body:JSON.stringify({backend:name,location:state.approvingLocation})}).then(()=>{ state.approvingBackend=null; loadApproved(); }); };
  app.unapproveBackend = function(name){ fetch("/v1/routing/approved/"+encodeURIComponent(name),{method:"DELETE",headers:hdr}).then(()=>loadApproved()); };
  // Sovereignty controls — real, owner-gated Sovereign Mode toggle
  async function loadControls(){ const d=await getJSON("/v1/controls"); if(d && !d.error){ window.__controls=d; render(); } }
  function _setSovereign(enabled){
    fetch("/v1/controls/sovereign",{method:"POST",headers:hdr,body:JSON.stringify({enabled})})
      .then(async r=>{ const d=await r.json(); if(r.ok){ window.__controls=d; loadInfra(); render(); } else alert("Failed: "+((d.error&&d.error.message)||r.status)); });
  }
  app.toggleSovereign = function(currentlyOn){
    if(currentlyOn){ state.sovereignConfirm=true; render(); }   // turning OFF → confirm
    else { _setSovereign(true); }                               // turning ON → safe, no confirm
  };
  app.cancelSovereignOff = function(){ state.sovereignConfirm=false; render(); };
  app.confirmSovereignOff = function(){ state.sovereignConfirm=false; _setSovereign(false); };
  app.markNotifsRead = function(){ fetch("/notifications/read",{method:"POST",headers:hdr}).then(()=>loadNotifs()); };
  app.onNotifClick = function(type){
    state.notifOpen=false;
    const d=notifDest(type);
    fetch("/notifications/read",{method:"POST",headers:hdr}).then(()=>loadNotifs());
    if(d){ app.setScreen(d.screen); } else { render(); }
  };
  app.toggleNotif = function(){ state.notifOpen=!state.notifOpen; state.profileMenuOpen=false; if(state.notifOpen) loadNotifs(); render(); };
  async function loadSso(){ const d=await getJSON("/auth/sso/status"); if(d){ window.__sso=d; render(); } }
  async function loadOrg(){ const d=await getJSON("/v1/settings"); if(d){ window.__org=d; render(); } }
  async function loadMe(){
    const d=await getJSON("/auth/me");
    if(d){ window.__me=d; render(); loadRouter(); return; }
    // /auth/me failed — if we optimistically logged in from a stored session
    // token, that session is stale/expired. Clear it and return to login
    // rather than showing a half-authenticated console full of empty states.
    if(sessionToken){
      try{ localStorage.removeItem("precepta_session"); }catch(e){}
      sessionToken=null; state.isLoggedIn=false; state.settingsOpen=false; render();
    }
  }
  async function loadSecurityFromAttestation(){
    const d=await getJSON("/attestation");
    if(d){
      state.securityControls.inBoundary = !!d.sovereign_mode;
      state.securityControls.egressLock = !!(d.egress_test && d.egress_test.result==="blocked");
      state.securityControls.auditOn = !!(d.audit);
      render();
    }
  }

  // Playground → real governed inference
  function sendText(text){
    text=(text||"").trim(); if(!text) return;
    if(!state.chatModel){ return; }
    state.messages.push({who:"You",text,align:"flex-end",textAlign:"right",bg:"#3B82F6",color:"#fff",hasMeta:false});
    state.chatInput=""; render();
    fetch("/v1/chat/completions",{method:"POST",headers:hdr,body:JSON.stringify({
      model:state.chatModel, messages:[{role:"user",content:text}], max_tokens:200})})
    .then(async r=>{
      const d=await r.json(); const p=d.precepta||{}; let reply;
      if(r.status!==200){
        reply={who:"preceptaai",text:(d.error&&d.error.message)||"blocked",align:"flex-start",textAlign:"left",
          bg:"#FEF2F2",color:"#991B1B",hasMeta:true,metaBackendBg:"#F3F4F6",metaBackendColor:"#6B7280",
          metaBackend:"backend: "+(p.backend_used||"none"),metaLatency:"",metaCost:"pii: "+(p.pii_redacted||0),
          metaPolicyBg:"#FEF2F2",metaPolicyColor:"#991B1B",metaPolicy:"policy: "+(p.policy_decision||"blocked")};
      } else {
        const content=(d.choices&&d.choices[0]&&d.choices[0].message.content)||"";
        reply={who:"preceptaai",text:content,align:"flex-start",textAlign:"left",bg:"#F3F4F6",color:"#111827",hasMeta:true,
          metaBackendBg:"#F3F4F6",metaBackendColor:"#374151",metaBackend:"backend: "+(p.backend_used||"")+(p.cache==="hit"?" (cache)":""),
          metaLatency:"latency: "+(p.latency_ms!=null?p.latency_ms+"ms":"?"),metaCost:"pii: "+(p.pii_redacted||0),
          metaPolicyBg:"#ECFDF5",metaPolicyColor:"#065F46",metaPolicy:"policy: "+(p.policy_decision||"allow"),
          traceId:p.trace_id||null,feedback:null};
      }
      state.messages.push(reply); render(); loadAuditLog(); loadStats();
    })
    .catch(e=>{ state.messages.push({who:"preceptaai",text:"error: "+e,align:"flex-start",textAlign:"left",bg:"#FEF2F2",color:"#991B1B",hasMeta:false}); render(); });
  }
  app.sendMessage = function(){ const el=document.getElementById("chatInput"); sendText(el ? el.value : state.chatInput); };
  app.sendSuggested = function(i){ sendText(SUGGESTED[i]); };
  app.rateMessage = function(mi,rating){
    const m=state.messages[mi]; if(!m||!m.traceId) return;
    m.feedback = rating>0?'up':'down'; render();      // optimistic
    fetch("/v1/feedback",{method:"POST",headers:hdr,body:JSON.stringify({trace_id:m.traceId,rating})})
      .catch(()=>{});
  };

  // Audit
  app.verifyChain = function(){ getJSON("/audit/verify").then(d=>{ if(d) alert("Audit chain "+(d.verified?"VERIFIED ✓":"FAILED")+" — "+d.events+" events"); }); };
  app.openAttestation = function(){ state.attestationOpen=true; window.__att=null; render(); getJSON("/attestation").then(d=>{ if(d){ window.__att=d; render(); } }); };
  app.exportAudit = function(){ getJSON("/audit/export").then(d=>{ if(!d) return;
    const blob=new Blob([JSON.stringify(d,null,2)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="precepta-audit-chain.json"; a.click(); }); };
  app.exportCsv = function(){ fetch("/audit/export.csv",{headers:hdr}).then(r=>r.text()).then(csv=>{
    const blob=new Blob([csv],{type:"text/csv"}); const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download="precepta-audit.csv"; a.click(); }); };

  // Policies → real CRUD
  app.togglePolicy = function(id){ fetch("/v1/policies/"+id+"/toggle",{method:"POST",headers:hdr}).then(loadPolicies); };
  app.savePolicy = function(){
    const s=state; if(!s.newPolicyName.trim()){ s.newPolicyOpen=false; render(); return; }
    const c={};
    if(s.newPolicyUrlAllow.trim()) c.url_allowlist=s.newPolicyUrlAllow.split(",").map(x=>x.trim()).filter(Boolean);
    if(s.newPolicyUrlBlock.trim()) c.url_blocklist=s.newPolicyUrlBlock.split(",").map(x=>x.trim()).filter(Boolean);
    if(s.newPolicyMaxTokens) c.max_tokens_per_day=parseInt(s.newPolicyMaxTokens);
    if(s.newPolicyMaxCalls) c.max_calls_per_hour=parseInt(s.newPolicyMaxCalls);
    if(s.newPolicyMaxCost) c.max_daily_cost_usd=parseFloat(s.newPolicyMaxCost);
    if(s.newPolicyPii) c.pii_filter_output=true;
    if(s.newPolicyDataTag) c.require_data_tag=true;
    const scope={};
    if(s.newPolicyScopeKeys.length) scope.keys=s.newPolicyScopeKeys;
    if(s.newPolicyScopeBackends.length) scope.backends=s.newPolicyScopeBackends;
    if(s.newPolicyScopeModels.length) scope.models=s.newPolicyScopeModels;
    const body={ name:s.newPolicyName, description:s.newPolicyDesc, action_type:s.newPolicyAction, effect:s.newPolicyEffect, conditions:c, scope:scope };
    const url = s.editingPolicyId ? "/v1/policies/"+s.editingPolicyId : "/v1/policies";
    const method = s.editingPolicyId ? "PUT" : "POST";
    fetch(url,{method:method,headers:hdr,body:JSON.stringify(body)}).then(()=>{ s.newPolicyOpen=false; s.editingPolicyId=null; loadPolicies(); });
  };

  // Onboarding "Test & connect" → register the backend
  const PROVIDER_OF = {onprem:"vllm", local:"ollama", neysa:"neysa", hf:"hf"};
  app.testConnection = function(){
    state.connectionStatus="testing"; render();
    const provider = PROVIDER_OF[state.infraSelected] || state.infraSelected;
    fetch("/v1/backends",{method:"POST",headers:hdr,body:JSON.stringify({
      provider, base_url:state.infraEndpoint, api_key:state.infraApiKey,
      model:(state.infraModel||"").trim(), in_boundary:true})})
    .then(async r=>{
      const d=await r.json();
      if(r.ok){ state.connectionStatus = d.healthy ? "success" : "unreachable"; await loadInfra(); }
      else { state.connectionStatus="idle"; alert("Registration failed: "+((d.error&&d.error.message)||r.status)); }
      render();
    }).catch(e=>{ state.connectionStatus="idle"; render(); alert("error: "+e); });
  };
  const _nextStep = app.nextStep;
  app.nextStep = function(){
    if(state.screen==="onboarding" && state.onboardStep===0
       && (state.infraEndpoint||"").trim() && state.connectionStatus!=="success"){
      app.testConnection();
    }
    _nextStep();
  };

  app.addBackend = function(){
    const s=state; if(!s.newBackendName.trim() && !s.newBackendEndpoint.trim()){ s.addBackendOpen=false; render(); return; }
    const type = PROVIDER_OF[s.newBackendType] || s.newBackendType;
    // Identity = a slug of the Name (BUG-001) so multiple backends of the same
    // provider type coexist; falls back to the type when no name is given.
    const slug = (s.newBackendName||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
    const provider = slug || type;
    fetch("/v1/backends",{method:"POST",headers:hdr,body:JSON.stringify({
      provider, name:s.newBackendName, base_url:s.newBackendEndpoint, api_key:s.newBackendKey,
      model:s.newBackendModel, in_boundary:s.newBackendInBoundary, tier:Number(s.newBackendTier)||2})})
    .then(async r=>{ const d=await r.json(); if(!r.ok){ alert("Failed: "+((d.error&&d.error.message)||r.status)); } s.addBackendOpen=false; loadInfra(); });
  };
  app.toggleBackendBoundary = function(provider, wasIn){
    fetch("/v1/backends/"+encodeURIComponent(provider)+"/boundary",{method:"POST",headers:hdr,
      body:JSON.stringify({in_boundary: !wasIn})})
      .then(async r=>{ if(!r.ok){ const d=await r.json().catch(()=>({})); alert("Failed: "+((d.error&&d.error.message)||r.status)); } loadInfra(); });
  };
  app.openPriceEdit = function(name, model, pin, pout){ state.priceEditFor={name,model,pin,pout}; render(); };
  app.closePriceEdit = function(){ state.priceEditFor=null; render(); };
  app.savePrice = function(){
    const p=state.priceEditFor; if(!p) return;
    const pin=parseFloat((document.getElementById('priceInIn')||{}).value)||0;
    const pout=parseFloat((document.getElementById('priceInOut')||{}).value)||0;
    fetch("/v1/pricing",{method:"POST",headers:hdr,body:JSON.stringify({
      backend:p.name, model:p.model||"", input_per_1m:pin, output_per_1m:pout, source:"console"})})
      .then(async r=>{ const d=await r.json(); if(r.ok){ state.priceEditFor=null; loadInfra(); } else alert("Failed: "+((d.error&&d.error.message)||r.status)); });
  };

  // Keys → real create/revoke; secret revealed once
  app.saveKey = function(){
    const s=state;
    const body={ allowed_backends:s.newKeyBackends, allowed_models:s.newKeyModels,
      cost_cap_daily:parseFloat(s.newKeyDailyCost)||0, cost_cap_monthly:parseFloat(s.newKeyMonthlyCost)||0,
      token_cap_daily:parseInt(s.newKeyTokenDaily)||0, token_cap_monthly:parseInt(s.newKeyTokenMonthly)||0 };
    if(s.editingKeyId){
      if(s.newKeyExpiry!=='keep') body.expires_in_days = s.newKeyExpiry==='never'?0:parseInt(s.newKeyExpiry||'90');
      fetch("/v1/keys/"+s.editingKeyId,{method:"PUT",headers:hdr,body:JSON.stringify(body)})
        .then(async r=>{ const d=await r.json(); if(r.ok){ state.newKeyOpen=false; state.editingKeyId=null; await loadKeys(); loadUsage(); } else { alert("Failed: "+((d.error&&d.error.message)||r.status)); } });
      return;
    }
    if(!(s.newKeyName||"").trim()){ s.newKeyOpen=false; render(); return; }
    body.name=s.newKeyName; body.expires_in_days = s.newKeyExpiry==='never'?0:parseInt(s.newKeyExpiry||'90');
    fetch("/v1/keys",{method:"POST",headers:hdr,body:JSON.stringify(body)})
    .then(async r=>{ const d=await r.json();
      if(r.ok){ state.newKeyOpen=false; state.revealKeyOpen=true; state.revealKeyValue=d.key; state.revealKeyCopied=false; state.newKeyName=""; await loadKeys(); loadUsage(); }
      else { alert("Failed: "+((d.error&&d.error.message)||r.status)); render(); } });
  };
  app.suspendKey = function(id,suspend){
    fetch("/v1/keys/"+id+"/"+(suspend?'suspend':'reactivate'),{method:"POST",headers:hdr})
      .then(()=>{ loadKeys(); });
  };
  app.confirmDeleteKey = function(){
    const dc=state.deleteConfirmKey; if(!dc) return;
    fetch("/v1/keys/"+dc.id,{method:"DELETE",headers:hdr}).then(()=>{ state.deleteConfirmKey=null; loadKeys(); });
  };

  // Settings
  app.saveOrgSetting = function(key, value){
    if(key.startsWith('__router_')){ app.saveRouterConfig({[key.slice('__router_'.length)]: value}); return; }
    fetch("/v1/settings",{method:"PUT",headers:hdr,body:JSON.stringify({[key]:value})})
      .then(async r=>{ const d=await r.json(); if(r.ok){ window.__org=d; render(); } else alert("Failed: "+((d.error&&d.error.message)||r.status)); });
  };

  // Router config (platform-owner only)
  async function loadRouter(){
    if(!(window.__me && window.__me.platform_owner)) return;
    const d=await getJSON("/v1/router/config");
    if(d && !d.error){ window.__router=d; render(); }
  }
  app.saveRouterConfig = function(patch){
    fetch("/v1/router/config",{method:"PUT",headers:hdr,body:JSON.stringify(patch)})
      .then(async r=>{ const d=await r.json(); if(r.ok){ window.__router=d; render(); }
        else alert("Router config: "+((d.error&&d.error.message)||r.status)); });
  };
  app.setRouterBackend = function(b){
    const r=window.__router||{};
    if(b==='hf' && !(r.hf_endpoint && r.hf_key_set)){ alert("Add the HF endpoint and key below first, then switch to it."); return; }
    app.saveRouterConfig({router_backend:b});
  };
  app.onRouterKeyInput = function(v){ state.routerKeyInput=v; render(); };
  app.saveRouterKey = function(){
    const v=state.routerKeyInput; if(!v) return;
    state.routerKeyInput=''; app.saveRouterConfig({hf_key:v});
  };

  // Google/OIDC-aware sign-in: real SSO redirect when configured, else dev login
  app.signIn = function(){
    fetch("/auth/sso/login").then(r=>r.json()).then(d=>{
      if(d && d.authorize_url){ window.location = d.authorize_url; }
      else { state.isLoggedIn=true; render(); loadAll(); }
    }).catch(()=>{ state.isLoggedIn=true; render(); loadAll(); });
  };

  // Load per-screen data on navigation
  const _setScreen = app.setScreen;
  app.setScreen = function(sc){ _setScreen(sc);
    if(sc==="overview"){ loadStats(); loadInfra(); }
    if(sc==="modelplane"){ loadInfra(); }
    if(sc==="audit"){ loadAuditLog(); }
    if(sc==="keys"){ loadKeys(); loadUsage(); loadInfra(); }
    if(sc==="policies"){ loadPolicies(); loadInfra(); loadKeys(); loadApproved(); loadControls(); }
    if(sc==="savings"){ loadFeatures(); }
    if(sc==="traces"){ loadOrg(); loadTraces(); }
    if(sc==="workflow"){ loadWorkflow(); }
  };
  async function loadAuthz(){
    const roles=await getJSON("/v1/authz/roles"); if(roles && roles.roles){ window.__authzRoles=roles.roles; render(); }
    const ab=await getJSON("/v1/authz/agent-budgets"); if(ab && Array.isArray(ab.agents)){ window.__agentBudgets=ab.agents; render(); }
  }
  window.__loadAuthz=loadAuthz;
  app.addAgentBudget=function(){
    const id=(document.getElementById('agIdIn')||{}).value, cap=(document.getElementById('agCapIn')||{}).value;
    if(!id||!cap){ alert('agent_id and daily cap required'); return; }
    fetch("/v1/authz/agent-budgets",{method:"POST",headers:hdr,body:JSON.stringify({agent_id:id,daily_request_cap:Number(cap)})})
      .then(async r=>{ const d=await r.json(); if(r.ok){ window.__agentBudgets=d.agents; render(); } else alert('Failed: '+((d.error&&d.error.message)||r.status)); });
  };
  async function loadFeatures(){ const d=await getJSON("/v1/features"); if(d && Array.isArray(d.endpoints)){ window.__features=d; render(); } }
  async function loadTraces(){ const d=await getJSON("/v1/traces"); if(d){ window.__traces=d; const ts=d.traces||[]; if(ts.length && !state.selectedTrace){ app.selectTrace(ts[0].request_id); } else { render(); } } }
  async function loadWorkflow(){ const d=await getJSON("/v1/workflow"); if(d && !d.error){ window.__workflow=d; render(); } }
  app.selectTrace = function(rid){ state.selectedTrace=rid; state.traceExpanded=null; window.__traceDetail=null; render(); getJSON("/v1/traces/"+encodeURIComponent(rid)).then(d=>{ if(d && !d.error){ window.__traceDetail=d; render(); } }); };
  app.setTraceTab = function(t){ state.traceTab=t; render(); };
  app.toggleCheckpoint = function(i){ state.traceExpanded=(state.traceExpanded===i?null:i); render(); };
  app.trResize = function(which, ev){
    ev.preventDefault();
    const runs=document.getElementById('trRuns'), check=document.getElementById('trCheck');
    if(!runs||!check) return;
    const startX=ev.clientX, sR=runs.offsetWidth, sC=check.offsetWidth;
    function mv(e){ const dx=e.clientX-startX;
      if(which===1){ const w=Math.max(180,Math.min(440,sR+dx)); runs.style.width=w+'px'; state.trRunsW=w; }
      else { const w=Math.max(240,Math.min(760,sC+dx)); check.style.width=w+'px'; state.trCheckW=w; } }
    function up(){ document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up); document.body.style.userSelect=''; }
    document.body.style.userSelect='none';
    document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up);
  };
  app.setSavingsTab = function(t){ state.savingsTab=t; render(); };
  app.setFeature = function(endpoint, patch){
    fetch("/v1/features/"+encodeURIComponent(endpoint),{method:"PUT",headers:hdr,body:JSON.stringify(patch)})
      .then(async r=>{ if(!r.ok){ const d=await r.json().catch(()=>({})); alert("Failed: "+((d.error&&d.error.message)||r.status)); } loadFeatures(); });
  };
  app.setCacheStrategy = function(endpoint, val){ app.setFeature(endpoint, val==='off' ? {cache_enabled:false} : {cache_enabled:true, cache_strategy:val}); };
  app.setCompressionMode = function(endpoint, val){ app.setFeature(endpoint, val==='off' ? {compression_enabled:false} : {compression_enabled:true, compression_mode:val}); };
  app.clearCache = function(){ fetch("/v1/cache/clear",{method:"POST",headers:hdr}).then(()=>loadFeatures()); };

  function loadAll(){
    loadInfra(); loadPolicies(); loadStats(); loadAuditLog(); loadSso(); loadOrg(); loadMe(); loadSecurityFromAttestation(); loadNotifs(); loadUsage(); loadApproved(); loadControls();
  }
  loadAll();
})();
</script>
</body>
</html>
